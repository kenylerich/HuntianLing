# HuntianLing pnpm workspace.
#
# Vendors the cordis family that the HuntianLing host plugin imports.
# The vendored sources are committed to this repo (see vendor/README.md
# for the sync procedure). Once the cordis family is published to npm
# and the host dsh repo no longer ships a custom build, drop this
# file, delete the vendor/ directory, and pin @deepseek-ai/cordis to
# the published version in package.json.

packages:
  - .

  # Cordis family.
  - 'vendor/cordis'
  - 'vendor/cosmokit'
  - 'vendor/include'
  - 'vendor/loader'

linkWorkspacePackages: true
