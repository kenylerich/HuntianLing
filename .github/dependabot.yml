version: 2

updates:
  - package-ecosystem: "npm"
    directory: "/"
    exclude-paths:
      # Vendored Cordis sources follow vendor/README.md instead of registry updates.
      - "vendor/**"
    schedule:
      interval: "cron"
      cronjob: "0 4 * * *"
      timezone: "Asia/Shanghai"
    cooldown:
      default-days: 30
    labels:
      - "kind/dependency"
      - "area/infra"

  # No `uv` ecosystem here: HuntianLing does not ship a Python SDK. The
  # previous config pointed at /python/sdk which does not exist, so the
  # daily cron opened dependabot PRs that could never merge.

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "cron"
      cronjob: "0 4 * * *"
      timezone: "Asia/Shanghai"
    cooldown:
      default-days: 30
    labels:
      - "kind/dependency"
      - "area/infra"
