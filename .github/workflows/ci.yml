name: CI

# HuntianLing's pull-request gate. Runs the lightweight gates declared in
# AGENTS.md (Quality gates): typecheck, lint, build, unit tests. The
# dsh-copied enterprise matrix (linux-primary / coverage / windows-wine
# / docs / e2e) was removed in the right-sizing commit; this workflow
# keeps only what HuntianLing's skeleton actually needs to stay green.

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PRIMARY_NODE_VERSION: '24'

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}

      # The cordis family is vendored under ./vendor/. tsc and the
      # Cordis runtime both need the bundled lib/index.js that this
      # script synthesises from the source under src/. Without it the
      # `@deepseek-ai/cordis` import in the host/ sub-plugin is
      # unresolvable, the e2e smoke fails, and a re-based PR
      # re-deriving a dependency bump would fail typecheck on master.
      # The script restores the vendored tsconfig so the commit is
      # not modified.
      - name: Build vendored cordis family
        run: bash scripts/build-vendored-cordis.sh

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          cache: pnpm

      - name: Install (immutable)
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build
        run: pnpm run build

      - name: Unit tests
        run: pnpm run test
