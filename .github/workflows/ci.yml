name: CI

# Required plugin quality checks and isolated customer/storage regression.

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PRIMARY_NODE_VERSION: '24'

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: htl_test
          POSTGRES_PASSWORD: fixture-only
          POSTGRES_DB: htl_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U htl_test -d htl_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      HUNTIANLING_POSTGRES_URL: postgres://htl_test:fixture-only@127.0.0.1:5432/htl_test
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}

      # The cordis family is vendored under ./vendor/. tsc and the
      # Cordis runtime both need the bundled lib/index.js that this
      # script synthesises from the source under src/. Without it the
      # `@deepseek-ai/cordis` import in the host/ sub-plugin is
      # unresolvable, the e2e smoke fails, and a re-based PR
      # re-deriving a dependency bump would fail typecheck on master.
      # The script restores the vendored tsconfig so the commit is
      # not modified.
      - name: Build vendored cordis family
        run: bash scripts/build-vendored-cordis.sh

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          cache: pnpm

      - name: Install (immutable)
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Bilingual docs
        run: pnpm run doc-sync

      - name: Build
        run: pnpm run build

      - name: Package hygiene
        run: pnpm run hygiene

      - name: Unit tests
        run: pnpm run test

      - name: Customer HTTP regression
        run: pnpm run test:e2e:customer

      - name: Issue lifecycle regression tests
        run: node --test .github/issue-management/policy.test.mjs

      - name: Duplication
        if: ${{ !cancelled() }}
        run: pnpm run duplication

      - name: Per-file coverage
        if: ${{ !cancelled() }}
        run: pnpm run test:coverage

      - name: Retain quality reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: quality-reports
          path: |
            coverage/coverage-summary.json
            output/verification/duplication/jscpd-report.json
