name: E2E

# HuntianLing plugin integration test. Confirms the package builds,
# the cordis host composition loads, and the plugin contributes the
# Services / Plugin shape that the dsh harness expects. Does NOT call
# the DeepSeek API — HuntianLing is a cordis plugin consumed BY dsh,
# not a product that calls dsh. Real-API coverage belongs in dsh.
#
# The cordis family is vendored under ./vendor/ in this repo. Each
# vendored package's tsconfig extends `../../tsconfig.base.json`, which
# only exists in the host dsh repo. To build them in isolation we
# synthesise a minimal local base, rewrite the extends path before
# running `tsc -b`, then run the per-package `tsdown` step that
# produces the .js files alongside the .d.ts that tsc emits. cordis's
# package.json points `main` / `types` at lib/* so the lib/ trees must
# exist before HuntianLing's TypeScript sources can resolve cordis's
# types.

on:
  workflow_dispatch:
  push:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: read

env:
  PRIMARY_NODE_VERSION: '24'

jobs:
  plugin-e2e:
    name: plugin-e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Build vendored cordis family
        run: |
          BASE_DIR="$(mktemp -d)"
          cat > "$BASE_DIR/tsconfig.base.json" <<'BASE'
          {
            "compilerOptions": {
              "target": "es2024",
              "module": "esnext",
              "moduleResolution": "bundler",
              "declaration": true,
              "composite": true,
              "skipLibCheck": true,
              "esModuleInterop": true,
              "allowImportingTsExtensions": true,
              "rewriteRelativeImportExtensions": true,
              "strict": true,
              "types": ["node"]
            }
          }
          BASE

          for pkg in cosmokit cordis include loader; do
            echo "=== vendor/$pkg ==="
            cd "vendor/$pkg"
            sed -i.bak "s|\"\\.\\./\\.\\./tsconfig\\.base\\.json\"|\"$BASE_DIR/tsconfig.base.json\"|" tsconfig.json

            pnpm install --ignore-scripts

            pnpm exec tsc -b tsconfig.json
            if [ -f tsdown.config.ts ] || [ -f tsdown.config.js ]; then
              pnpm dlx tsdown@latest
            fi

            mv tsconfig.json.bak tsconfig.json
            cd "$GITHUB_WORKSPACE"
          done

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          cache: pnpm

      - name: Install (immutable)
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Unit tests
        run: pnpm run test

      - name: Plugin integration test
        run: pnpm run test:e2e
