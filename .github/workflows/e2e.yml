name: Plugin e2e

# HuntianLing plugin integration test. Confirms the package builds,
# the cordis host composition loads, and the plugin contributes the
# Services / Plugin shape that the dsh harness expects. Does NOT call
# the DeepSeek API — HuntianLing is a cordis plugin consumed BY dsh,
# not a product that calls dsh. Real-API coverage belongs in dsh.
#
# The cordis family is vendored under ./vendor/ in this repo. The
# build step (scripts/build-vendored-cordis.sh) synthesises a
# minimal local base, runs tsc + tsdown per package in topological
# order, and restores the vendored tsconfig so the commit is not
# modified.

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: read

env:
  PRIMARY_NODE_VERSION: '24'

jobs:
  plugin-e2e:
    name: plugin-e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}

      - name: Build vendored cordis family
        run: bash scripts/build-vendored-cordis.sh

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          cache: pnpm

      - name: Install (immutable)
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Unit tests
        run: pnpm run test

      - name: Plugin integration test
        run: pnpm run test:e2e
