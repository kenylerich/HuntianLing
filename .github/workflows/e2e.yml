name: E2E

# HuntianLing's real-API smoke test. Runs `pnpm run test:e2e` against the
# DeepSeek API when DEEPSEEK_API_KEY is present and the event is trusted
# (push to master or workflow_dispatch). Skipped — never failed — when the
# key is absent or the event is untrusted (forked PR, dependabot).
#
# SECURITY — Never change `pull_request` to `pull_request_target`: the
# latter runs in the base repo's context WITH secrets while still able to
# check out untrusted fork code, which is a textbook key-leak vector.

on:
  workflow_dispatch:
  push:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: read

env:
  PRIMARY_NODE_VERSION: '24'

jobs:
  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Run only on trusted events (push to master, manual dispatch). PRs from
    # forks and dependabot PRs withhold secrets, so the preflight would
    # otherwise hard-fail — a job skipped by `if:` reports as a SUCCESSFUL
    # check, which is what we want.
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          cache: pnpm

      - name: Install (immutable)
        run: pnpm install --frozen-lockfile

      - name: Preflight (require DEEPSEEK_API_KEY)
        run: |
          if [ -z "$DEEPSEEK_API_KEY" ]; then
            echo "DEEPSEEK_API_KEY is not set; this run is trusted but the key is absent." >&2
            echo "Set the DEEPSEEK_API_KEY repository secret and re-run." >&2
            exit 1
          fi

      - name: Build
        run: pnpm run build

      - name: E2E tests
        run: pnpm run test:e2e
