name: Expected filenames

# The pull_request trigger has been disabled on this HuntianLing instance
# (commit history: 992f7bd follow-up cleanup, see AGENTS.md #18 follow-up).
# The workflow remains in the repository as a reference asset that matches
# the upstream dsh shape; re-enable by restoring the `pull_request:` block.
# Manual dispatch via workflow_dispatch is still possible.
on:
  # pull_request:
  #   paths:
  #     - '*[gG][oO][lL][dD][eE][nN]*'
  #     - '**/*[gG][oO][lL][dD][eE][nN]*'
  #     - '!vendor/**'
  workflow_dispatch:

permissions:
  contents: read

env:
  # CI runs must never report to the production telemetry endpoint baked
  # into apps/cli/cordis.yml (AppCLIEntry disables the row when set).
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  expected-filenames:
    name: no golden filenames
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Check tracked filenames
        run: scripts/check-expected-filenames.sh
