name: Issue lifecycle

on:
  issues:
    types:
      - opened
      - edited
      - assigned
      - unassigned
      - labeled
      - unlabeled
      - closed
      - reopened
      - field_added
      - field_removed
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - reopened
      - labeled
      - unlabeled
      - review_requested
  pull_request_review:
    types:
      - submitted
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: issue-lifecycle-${{ github.event.issue.number || github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

jobs:
  lifecycle:
    name: Issue lifecycle
    runs-on: ubuntu-latest
    steps:
      - name: Check out trusted policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      # GitHub App is preferred (user-owned Project V2 writes). A classic
      # PAT in HUNTIANLING_PROJECT_TOKEN is the supported fallback.
      # github.token cannot write kenylerich's user-level Project.
      - name: Create GitHub App token
        id: app-token
        if: ${{ vars.HUNTIANLING_ISSUE_APP_CLIENT_ID != '' && (github.event_name != 'pull_request_review' || github.event.review.state == 'changes_requested') }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ vars.HUNTIANLING_ISSUE_APP_CLIENT_ID }}
          private-key: ${{ secrets.HUNTIANLING_ISSUE_APP_PRIVATE_KEY }}
          owner: kenylerich
          repositories: HuntianLing

      - name: Resolve board token
        id: board-token
        if: ${{ github.event_name != 'pull_request_review' || github.event.review.state == 'changes_requested' }}
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          PROJECT_TOKEN: ${{ secrets.HUNTIANLING_PROJECT_TOKEN }}
        run: |
          if [ -n "$APP_TOKEN" ]; then
            echo "source=github-app" >> "$GITHUB_OUTPUT"
            echo "token=$APP_TOKEN" >> "$GITHUB_OUTPUT"
          elif [ -n "$PROJECT_TOKEN" ]; then
            echo "source=project-token" >> "$GITHUB_OUTPUT"
            echo "token=$PROJECT_TOKEN" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Issue lifecycle cannot write the user-owned Project. Set repository variable HUNTIANLING_ISSUE_APP_CLIENT_ID plus secret HUNTIANLING_ISSUE_APP_PRIVATE_KEY, or set secret HUNTIANLING_PROJECT_TOKEN to a classic PAT with repo+project scopes. See AGENTS.md § Issue assets."
            exit 1
          fi

      - name: Handle repository event
        if: ${{ github.event_name != 'pull_request_review' || github.event.review.state == 'changes_requested' }}
        env:
          GH_TOKEN: ${{ steps.board-token.outputs.token }}
          PROJECT_TOKEN: ${{ steps.board-token.outputs.token }}
        run: node .github/issue-management/policy.mjs lifecycle
